<main class="page">
  <mat-card class="demo-card">
    <mat-card-header>
      <mat-card-title>{{ title() }}</mat-card-title>
      <mat-card-subtitle>Angular Material enabled</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>This app now uses Angular Material components and a Material theme.</p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-flat-button color="primary" type="button">Get started</button>
    </mat-card-actions>
  </mat-card>
</main>
